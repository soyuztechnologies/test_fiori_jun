specVersion: "4.0"
metadata:
  name: fiorilikeapp
type: application
builder:
  customTasks:
    - name: ui5-tools-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
  - name: fiori-tools-proxy
    afterMiddleware: compression
    configuration:
      backend:
      - path: /sap
        url: http://122.162.240.164:8010
        destination: ANUBHAV
  - name: ui5-tooling-transpile-middleware
    afterMiddleware: compression